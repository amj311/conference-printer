<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paged.js page-break example</title>

  <style>
    @page {
      size: A5;
      margin: 20mm;
      outline: 1px solid;
    }

    body {
      font: 16px/1.5 sans-serif;
    }

.chapter {
  break-after: page !important;
}

    #rendered {
      margin: 2rem auto;
    }
  </style>

  <script>
    window.PagedConfig = { auto: false };
  </script>
  <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>
</head>
<body>
  <main id="source">
    <section class="chapter">
      <h1>Chapter One</h1>
      <p>This content begins on page 1.</p>
    </section>

    <section class="chapter">
      <h1>Chapter Two</h1>
      <p>The <code>break-before: page</code> rule starts this on a new page.</p>
    </section>

    <section class="chapter">
      <h1>Chapter Three</h1>
      <p>This also begins on a new page.</p>
    </section>
  </main>

  <div id="rendered"></div>

  <script>
    window.addEventListener("load", async () => {
      const source = document.querySelector("#source");
      const target = document.querySelector("#rendered");

      await window.PagedPolyfill.preview(source, ["./pages.css"], target);

      console.log(typeof window.PagedPolyfill);
console.log(getComputedStyle(document.querySelector(".chapter")).breakAfter);
console.log(
  document.querySelectorAll("#rendered .pagedjs_page").length
);

const second = document.querySelectorAll("#source .chapter")[1];
console.log(getComputedStyle(second).breakBefore);
console.log(getComputedStyle(second).pageBreakBefore);



    });
    
  </script>
</body>
</html>
